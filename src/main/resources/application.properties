spring.application.name=researchmate-backend

# ========================================
# Server
# ========================================

server.port=8080


# ========================================
# Database
# ========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/researchmate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# ========================================
# JPA / Hibernate
# ========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ========================================
# Actuator
# ========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash

# MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=researchmate-backend
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC

spring.ai.mcp.client.streamable-http.connections.researchmate-mcp.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.researchmate-mcp.endpoint=/mcp
spring.ai.mcp.client.request-timeout=120s